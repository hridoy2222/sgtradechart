<!DOCTYPE html>
<html>
<head>
  <title>SGTRADECHART</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>SGTRADECHART</h1>
  <button>LIVE OTC</button>
</header>

<div class="container">

  <div class="pairs">
    <h2>OTC PAIRS</h2>

    <div class="pair">EUR/USD OTC</div>
    <div class="pair">USD/BRL OTC</div>
    <div class="pair">GBP/JPY OTC</div>
  </div>

  <div class="chart">
    <iframe
      src="https://s.tradingview.com/widgetembed/?symbol=FX:EURUSD&interval=1&theme=dark"
      width="100%"
      height="500"
    ></iframe>
  </div>

  <div class="signal">
    <h2>AI SIGNAL</h2>

    <div class="buy">
      BUY SIGNAL
      <p>Strength: 91%</p>
    </div>

    <div class="sell">
      SELL SIGNAL
      <p>Strength: 77%</p>
    </div>
  </div>

</div>

<script src="script.js"></script>

</body>
</html>
